<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Izjava — fiskalni račun za gorivo">
  <defs>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="108"/>
    </clipPath>
  </defs>

  <!-- pozadina: srpska trobojka, talasasta (isti stil kao parking/qrpay app) -->
  <g clip-path="url(#rounded)">
    <path fill="#C6363C" d="M 0 0 L 512 0 L 512 178 Q 384 215, 256 178 Q 128 141, 0 178 Z"/>
    <path fill="#0C4076" d="M 0 178 Q 128 141, 256 178 Q 384 215, 512 178 L 512 348 Q 384 311, 256 348 Q 128 385, 0 348 Z"/>
    <path fill="#FFFFFF" d="M 0 348 Q 128 385, 256 348 Q 384 311, 512 348 L 512 512 L 0 512 Z"/>
  </g>

  <!-- beli panel -->
  <rect x="84" y="116" width="344" height="292" rx="46"
        fill="#FFFFFF" stroke="#1A1A1A" stroke-width="22" stroke-linejoin="round" paint-order="stroke fill"/>

  <!-- AUTO (bočni izgled), plav -->
  <g stroke="#1A1A1A" stroke-width="13" stroke-linejoin="round" paint-order="stroke fill">
    <!-- kabina -->
    <path d="M 188 156 L 286 156 Q 318 156, 338 196 L 188 196 Z" fill="#9DB8D6"/>
    <!-- telo -->
    <path d="M 120 246
             Q 120 210, 158 200
             L 348 200
             Q 372 200, 386 224
             L 392 234
             Q 396 246, 384 250
             L 132 250
             Q 120 250, 120 246 Z" fill="#0C4076"/>
  </g>
  <!-- točkovi -->
  <circle cx="178" cy="250" r="34" fill="#1A1A1A"/>
  <circle cx="178" cy="250" r="14" fill="#FFFFFF"/>
  <circle cx="332" cy="250" r="34" fill="#1A1A1A"/>
  <circle cx="332" cy="250" r="14" fill="#FFFFFF"/>

  <!-- QR kod (stilizovan, nije skenabilan) -->
  <g transform="translate(180, 290)">
    <rect x="-10" y="-10" width="172" height="116" rx="16" fill="#F4F6F8"/>
    <!-- 3 finder kvadrata -->
    <rect x="2"   y="2"  width="34" height="34" rx="7" fill="#1A1A1A"/>
    <rect x="12"  y="12" width="14" height="14" rx="3" fill="#F4F6F8"/>
    <rect x="116" y="2"  width="34" height="34" rx="7" fill="#1A1A1A"/>
    <rect x="126" y="12" width="14" height="14" rx="3" fill="#F4F6F8"/>
    <rect x="2"   y="62" width="34" height="34" rx="7" fill="#1A1A1A"/>
    <rect x="12"  y="72" width="14" height="14" rx="3" fill="#F4F6F8"/>
    <!-- moduli -->
    <rect x="52"  y="4"   width="13" height="13" rx="3" fill="#1A1A1A"/>
    <rect x="72"  y="20"  width="13" height="13" rx="3" fill="#1A1A1A"/>
    <rect x="92"  y="4"   width="13" height="13" rx="3" fill="#C6363C"/>
    <rect x="52"  y="40"  width="13" height="13" rx="3" fill="#1A1A1A"/>
    <rect x="86"  y="40"  width="13" height="13" rx="3" fill="#1A1A1A"/>
    <rect x="116" y="50"  width="34" height="34" rx="7" fill="#1A1A1A"/>
    <rect x="126" y="60"  width="14" height="14" rx="3" fill="#F4F6F8"/>
    <rect x="52"  y="66"  width="13" height="13" rx="3" fill="#1A1A1A"/>
    <rect x="72"  y="82"  width="13" height="13" rx="3" fill="#1A1A1A"/>
    <rect x="92"  y="66"  width="13" height="13" rx="3" fill="#1A1A1A"/>
  </g>
</svg>
