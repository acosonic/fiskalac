<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Izjava — fiskalni račun za gorivo">
  <defs>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="108"/>
    </clipPath>
  </defs>

  <!-- srpska trobojka, talasasta -->
  <g clip-path="url(#rounded)">
    <path fill="#C6363C" d="M 0 0 L 512 0 L 512 178 Q 384 215, 256 178 Q 128 141, 0 178 Z"/>
    <path fill="#0C4076" d="M 0 178 Q 128 141, 256 178 Q 384 215, 512 178 L 512 348 Q 384 311, 256 348 Q 128 385, 0 348 Z"/>
    <path fill="#FFFFFF" d="M 0 348 Q 128 385, 256 348 Q 384 311, 512 348 L 512 512 L 0 512 Z"/>
  </g>

  <g clip-path="url(#rounded)">
